name: Maven Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release, for example 5.3.1
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-releases
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure release version
        run: |
          ./mvnw -B versions:set \
            -DnewVersion="${{ inputs.release_version }}" \
            -DgenerateBackupPoms=false

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet pom.xml; then
            echo "pom.xml already uses version ${{ inputs.release_version }}"
          else
            git add pom.xml
            git commit -m "Release v${{ inputs.release_version }}"
            git push
          fi

      - name: Create Git tag
        run: |
          git tag "v${{ inputs.release_version }}"
          git push origin "v${{ inputs.release_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.release_version }}" \
            target/*.jar \
            --title "v${{ inputs.release_version }}" \
            --notes "Release v${{ inputs.release_version }}"
